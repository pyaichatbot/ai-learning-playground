<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var base = '/ai-learning-playground';
        var path = window.location.pathname;

        // Stop index.html duplication loops immediately.
        if (path.indexOf('/index.html') !== -1) {
          window.location.replace(base + '/');
          return;
        }

        var route = path.startsWith(base) ? path.slice(base.length) : '/';
        if (!route.startsWith('/')) {
          route = '/' + route;
        }

        window.location.replace(base + '/?route=' + encodeURIComponent(route));
      })();
    </script>
  </head>
  <body></body>
</html>
