<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fine-Tuning Mastery — Interactive Learning Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Barlow+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<style>
:root {
  --acc: #6366f1; --acc-h: #818cf8;
  --bg: #0f0f1a; --bg2: #14142a; --bg3: #1a1a35;
  --surf: #1e1e3a; --border: #2a2a50;
  --text: #e2e8f0; --muted: #94a3b8; --dim: #64748b;
  --green: #10b981; --yellow: #f59e0b; --red: #ef4444; --orange: #f97316;
  --fd: 'Oxanium',sans-serif; --fb: 'Barlow',sans-serif; --fm: 'Barlow Mono',monospace;
  --sw: 264px;
}
[data-theme="light"] {
  --bg:#f8fafc; --bg2:#f1f5f9; --bg3:#e8edf5;
  --surf:#fff; --border:#cbd5e1;
  --text:#1e293b; --muted:#475569; --dim:#94a3b8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:var(--fb);background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}
/* SIDEBAR */
#sb{width:var(--sw);min-width:var(--sw);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#sb-head{padding:18px 14px 12px;border-bottom:1px solid var(--border)}
#sb-head h1{font-family:var(--fd);font-size:.85rem;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.07em;line-height:1.3}
#sb-head p{font-size:.68rem;color:var(--dim);margin-top:3px}
#srch-wrap{padding:9px 11px;border-bottom:1px solid var(--border)}
#srch{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--fb);font-size:.78rem;padding:6px 10px;outline:none;transition:border-color .15s}
#srch:focus{border-color:var(--acc)}
#pb-wrap{padding:7px 12px;border-bottom:1px solid var(--border)}
.pb-lbl{display:flex;justify-content:space-between;font-size:.67rem;color:var(--dim);margin-bottom:4px}
.pb{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden}
.pb-fill{height:100%;background:var(--acc);border-radius:2px;transition:width .4s}
#nav{flex:1;overflow-y:auto;padding:6px 0}
.ni{display:flex;align-items:center;gap:9px;padding:8px 13px;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
.ni:hover{background:var(--surf)}
.ni.active{background:var(--surf);border-left-color:var(--acc)}
.ni-num{font-family:var(--fd);font-size:.63rem;font-weight:700;color:var(--dim);min-width:20px}
.ni.active .ni-num{color:var(--acc)}
.ni-txt{flex:1}
.ni-title{font-size:.76rem;font-weight:500;color:var(--text);line-height:1.3}
.ni-lvl{font-size:.63rem;color:var(--dim);margin-top:1px}
.ni-chk{width:15px;height:15px;min-width:15px;border:1.5px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.55rem;color:transparent;transition:all .2s}
.ni.done .ni-chk{background:var(--green);border-color:var(--green);color:#fff}
#tools-nav{border-top:1px solid var(--border);padding:6px 0}
.tb{display:flex;align-items:center;gap:8px;padding:8px 13px;cursor:pointer;font-size:.76rem;color:var(--muted);transition:all .15s;width:100%;background:none;border:none;text-align:left;font-family:var(--fb)}
.tb:hover,.tb.active{color:var(--acc);background:var(--surf)}
#ctrls{padding:8px 11px;border-top:1px solid var(--border);display:flex;gap:6px}
.cb{flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg3);color:var(--muted);cursor:pointer;font-size:.69rem;font-family:var(--fb);transition:all .15s}
.cb:hover{border-color:var(--acc);color:var(--acc)}
/* MAIN */
#main{flex:1;overflow-y:auto;padding:36px 52px}
@media(max-width:900px){#main{padding:20px 24px}}
/* MODULE */
.mh{margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.mh-num{font-family:var(--fd);font-size:.72rem;color:var(--acc);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.mh-title{font-family:var(--fd);font-size:1.85rem;font-weight:700;color:var(--text);line-height:1.2;margin:7px 0 6px}
.mh-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lbadge{padding:3px 10px;border-radius:20px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.lb-b{background:rgba(16,185,129,.12);color:var(--green)}
.lb-i{background:rgba(245,158,11,.12);color:var(--yellow)}
.lb-a{background:rgba(239,68,68,.12);color:var(--red)}
.lb-e{background:rgba(99,102,241,.12);color:var(--acc)}
/* Content */
.cb h2{font-family:var(--fd);font-size:1.15rem;font-weight:600;color:var(--text);margin:26px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.cb h3{font-size:.97rem;font-weight:600;color:var(--text);margin:18px 0 7px}
.cb p{line-height:1.72;color:var(--muted);margin-bottom:11px;font-size:.9rem}
.cb ul,.cb ol{padding-left:18px;margin-bottom:11px}
.cb li{color:var(--muted);font-size:.9rem;line-height:1.7;margin-bottom:3px}
.cb strong{color:var(--text)}
.cb code:not([class]){background:var(--surf);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:.83em;font-family:var(--fm);color:var(--acc-h)}
.cb pre{margin:14px 0;border-radius:8px;overflow:auto;border:1px solid var(--border)}
.cb pre code{font-size:.81rem;font-family:var(--fm)}
.cb table{width:100%;border-collapse:collapse;margin:14px 0;font-size:.83rem}
.cb th{background:var(--surf);color:var(--text);font-weight:600;padding:8px 11px;text-align:left;border:1px solid var(--border)}
.cb td{padding:7px 11px;border:1px solid var(--border);color:var(--muted);vertical-align:top}
.cb tr:hover td{background:var(--surf)}
/* Callouts */
.co{padding:13px 15px;border-radius:8px;margin:14px 0;border-left:3px solid;font-size:.87rem;line-height:1.65}
.co-k{background:rgba(99,102,241,.07);border-color:var(--acc);color:var(--muted)}
.co-w{background:rgba(245,158,11,.07);border-color:var(--yellow);color:var(--muted)}
.co-d{background:rgba(239,68,68,.07);border-color:var(--red);color:var(--muted)}
.co-t{background:rgba(16,185,129,.07);border-color:var(--green);color:var(--muted)}
/* Mark read */
.mr-btn{display:inline-flex;align-items:center;gap:8px;margin-top:30px;padding:10px 20px;background:var(--acc);color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:var(--fb);font-size:.87rem;font-weight:600;transition:all .2s}
.mr-btn:hover{background:var(--acc-h)}
.mr-btn.done{background:var(--green)}
/* QUIZ */
.qz{margin-top:38px;padding:22px;background:var(--surf);border-radius:12px;border:1px solid var(--border)}
.qz-hd{font-family:var(--fd);font-size:.97rem;font-weight:600;color:var(--text);margin-bottom:18px}
.qq{margin-bottom:22px}
.qq-txt{font-size:.9rem;font-weight:500;color:var(--text);margin-bottom:10px;line-height:1.5}
.q-opts{display:flex;flex-direction:column;gap:7px}
.q-opt{padding:9px 13px;border:1px solid var(--border);border-radius:7px;cursor:pointer;font-size:.85rem;color:var(--muted);transition:all .15s;background:var(--bg2);text-align:left;width:100%;font-family:var(--fb)}
.q-opt:hover:not([disabled]){border-color:var(--acc);color:var(--text)}
.q-opt.correct{background:rgba(16,185,129,.1);border-color:var(--green);color:var(--green)}
.q-opt.wrong{background:rgba(239,68,68,.1);border-color:var(--red);color:var(--red)}
.q-opt.reveal{border-color:var(--green);background:rgba(16,185,129,.05)}
.q-exp{margin-top:8px;padding:9px 11px;background:var(--bg3);border-radius:6px;font-size:.8rem;color:var(--muted);display:none;line-height:1.5}
/* TOOLS */
.th{margin-bottom:26px}
.th h2{font-family:var(--fd);font-size:1.65rem;font-weight:700;color:var(--text);margin-bottom:5px}
.th p{color:var(--muted);font-size:.88rem}
/* GPU Calc */
.calc-g{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:22px}
@media(max-width:700px){.calc-g{grid-template-columns:1fr}}
.cf label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:5px;font-weight:500}
.cf input[type=range]{width:100%;accent-color:var(--acc);margin-top:4px}
.cf select,.cf-val{width:100%;background:var(--surf);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px 10px;font-family:var(--fb);font-size:.83rem}
.cf-val{background:var(--bg3);cursor:default;font-family:var(--fm)}
.cr{background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:22px}
.cr h3{font-family:var(--fd);font-size:.78rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}
.vd{font-family:var(--fd);font-size:2.8rem;font-weight:700;color:var(--acc);line-height:1;margin-bottom:6px}
.vb{font-size:.78rem;color:var(--dim);margin-bottom:18px;line-height:1.9;font-family:var(--fm)}
.gpu-recs{display:flex;flex-direction:column;gap:7px}
.gr{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:7px;font-size:.8rem}
.gr-ok{background:rgba(16,185,129,.1);color:var(--green)}
.gr-w{background:rgba(245,158,11,.1);color:var(--yellow)}
.gr-no{background:rgba(239,68,68,.08);color:var(--red)}
/* Checklist */
.hs{text-align:center;padding:22px;background:var(--surf);border:1px solid var(--border);border-radius:12px;margin-bottom:22px}
.hs-n{font-family:var(--fd);font-size:3.2rem;font-weight:700;line-height:1;margin-bottom:4px}
.hs-l{font-size:.83rem;color:var(--muted)}
.apl{display:flex;flex-direction:column;gap:9px}
.api{display:flex;align-items:flex-start;gap:11px;padding:11px 14px;background:var(--surf);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s}
.api:hover{border-color:var(--acc)}
.api.chk{border-color:var(--green);opacity:.65}
.ap-cb{width:17px;height:17px;min-width:17px;border:2px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.65rem;transition:all .2s;margin-top:2px}
.api.chk .ap-cb{background:var(--green);border-color:var(--green);color:#fff}
.ap-n{font-size:.86rem;font-weight:600;color:var(--text)}
.ap-d{font-size:.76rem;color:var(--muted);margin-top:2px;line-height:1.4}
/* Wizard */
.wz-steps{display:flex;margin-bottom:26px;border-bottom:2px solid var(--border)}
.wz-s{flex:1;text-align:center;padding:9px 6px;font-size:.72rem;color:var(--dim);cursor:default;transition:all .2s;border-bottom:2px solid transparent;margin-bottom:-2px}
.wz-s.active{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
.wz-s.done{color:var(--green);border-bottom-color:var(--green)}
.wp{display:none}
.wp.active{display:block}
.wq{font-size:1rem;font-weight:600;color:var(--text);margin-bottom:14px}
.wopts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(max-width:600px){.wopts{grid-template-columns:1fr}}
.wo{padding:13px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;background:var(--surf)}
.wo:hover{border-color:var(--acc)}
.wo.sel{border-color:var(--acc);background:rgba(99,102,241,.1)}
.wo-t{font-size:.86rem;font-weight:600;color:var(--text);margin-bottom:3px}
.wo-d{font-size:.76rem;color:var(--muted)}
.wz-nav{display:flex;gap:9px;margin-top:18px;justify-content:flex-end}
.btn-p{padding:9px 20px;background:var(--acc);color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:var(--fb);font-size:.83rem;font-weight:600;transition:background .15s}
.btn-p:hover{background:var(--acc-h)}
.btn-p:disabled{opacity:.4;cursor:default}
.btn-s{padding:9px 20px;background:var(--surf);color:var(--muted);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-family:var(--fb);font-size:.83rem}
.wres{padding:22px;background:var(--surf);border:1px solid var(--acc);border-radius:12px}
.wres h3{font-family:var(--fd);font-size:1.15rem;color:var(--acc);margin-bottom:10px}
.wres p{font-size:.88rem;color:var(--muted);line-height:1.65;margin-bottom:8px}
.rtag{display:inline-block;padding:3px 9px;background:rgba(99,102,241,.15);color:var(--acc);border-radius:20px;font-size:.73rem;font-weight:600;margin:3px 3px 3px 0}
/* SVG */
.diagram svg{max-width:100%;height:auto}
/* scrollbar */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<div id="sb">
  <div id="sb-head">
    <h1>Fine-Tuning Mastery</h1>
    <p>Beginner → SME Curriculum</p>
  </div>
  <div id="srch-wrap">
    <input id="srch" type="text" placeholder="Search modules…" autocomplete="off" oninput="doSearch(this.value)">
  </div>
  <div id="pb-wrap">
    <div class="pb-lbl"><span>Progress</span><span id="pb-txt">0 / 10</span></div>
    <div class="pb"><div class="pb-fill" id="pb-fill" style="width:0%"></div></div>
  </div>
  <div id="nav"></div>
  <div id="tools-nav">
    <button class="tb" id="tb-calc" onclick="showTool('calc')">⚡ GPU Memory Calculator</button>
    <button class="tb" id="tb-wiz" onclick="showTool('wiz')">🧭 Decision Wizard</button>
    <button class="tb" id="tb-ap" onclick="showTool('ap')">✓ Anti-Pattern Checklist</button>
  </div>
  <div id="ctrls">
    <button class="cb" onclick="toggleTheme()">☀ Theme</button>
    <button class="cb" onclick="resetProgress()">↺ Reset</button>
  </div>
</div>

<div id="main">
  <div id="mv"></div>
  <div id="tv" style="display:none"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<script>
const MODULES = [
{id:'00',title:'Foundations & Decision Framework',level:'Beginner',lc:'b',
summary:'Decide whether fine-tuning is the right tool. Understand the full taxonomy.',
content:`
<h2>The Fine-Tuning Taxonomy</h2>
<p>Fine-tuning continues training a pre-trained model on task-specific data, updating some or all weights. Four techniques — each for a different problem:</p>
<table><tr><th>Technique</th><th>What It Does</th><th>When to Use</th></tr>
<tr><td><strong>SFT</strong></td><td>Train on labeled (input, output) pairs</td><td>You have task examples; default choice</td></tr>
<tr><td><strong>DAPT</strong></td><td>Continue pre-training on domain text (unlabeled)</td><td>Model lacks domain vocabulary (medical, legal, fintech)</td></tr>
<tr><td><strong>RLHF / DPO</strong></td><td>Optimize for human preference signals</td><td>Style, tone, safety alignment</td></tr>
<tr><td><strong>PEFT</strong></td><td>Adapt with minimal trainable parameters</td><td>Limited GPU; runtime adapter swapping</td></tr>
</table>
<h2>Decision Framework: Is Fine-Tuning Right?</h2>
<div class="diagram">
<svg viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a0" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,9 3,0 6" fill="#6366f1"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,9 3,0 6" fill="#10b981"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,9 3,0 6" fill="#ef4444"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,9 3,0 6" fill="#f97316"/></marker>
  </defs>

  <!-- START -->
  <rect x="210" y="14" width="280" height="52" rx="10" fill="rgba(99,102,241,0.18)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="350" y="36" text-anchor="middle" fill="#818cf8" font-size="13" font-weight="700" font-family="Barlow,sans-serif">Do you have a task</text>
  <text x="350" y="55" text-anchor="middle" fill="#818cf8" font-size="13" font-weight="700" font-family="Barlow,sans-serif">that needs adaptation?</text>

  <!-- START → Q1 -->
  <line x1="350" y1="66" x2="350" y2="102" stroke="#6366f1" stroke-width="1.5" marker-end="url(#a0)"/>

  <!-- Q1: Prompt engineering? -->
  <rect x="175" y="102" width="350" height="52" rx="9" fill="rgba(26,26,52,0.95)" stroke="#2a2a50" stroke-width="1.5"/>
  <text x="350" y="124" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="Barlow,sans-serif">Try prompt engineering first.</text>
  <text x="350" y="142" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Barlow,sans-serif">Is it sufficient for your task?</text>

  <!-- Q1 YES → STOP (right) -->
  <line x1="525" y1="128" x2="567" y2="128" stroke="#10b981" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="545" y="121" text-anchor="middle" fill="#10b981" font-size="11" font-weight="700" font-family="Barlow,sans-serif">YES</text>
  <rect x="568" y="108" width="124" height="44" rx="8" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="1.5"/>
  <text x="630" y="127" text-anchor="middle" fill="#10b981" font-size="12" font-weight="700" font-family="Barlow,sans-serif">STOP</text>
  <text x="630" y="143" text-anchor="middle" fill="#10b981" font-size="11" font-family="Barlow,sans-serif">Use Prompting ✓</text>

  <!-- Q1 NO → Q2 (down) -->
  <line x1="350" y1="154" x2="350" y2="193" stroke="#ef4444" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="363" y="178" fill="#ef4444" font-size="11" font-weight="700" font-family="Barlow,sans-serif">NO</text>

  <!-- Q2: RAG sufficient? -->
  <rect x="175" y="193" width="350" height="52" rx="9" fill="rgba(26,26,52,0.95)" stroke="#2a2a50" stroke-width="1.5"/>
  <text x="350" y="215" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="Barlow,sans-serif">Is RAG sufficient?</text>
  <text x="350" y="233" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Barlow,sans-serif">(frequently updated facts or docs)</text>

  <!-- Q2 YES → Use RAG (right) -->
  <line x1="525" y1="219" x2="567" y2="219" stroke="#10b981" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="545" y="212" text-anchor="middle" fill="#10b981" font-size="11" font-weight="700" font-family="Barlow,sans-serif">YES</text>
  <rect x="568" y="199" width="124" height="44" rx="8" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="1.5"/>
  <text x="630" y="218" text-anchor="middle" fill="#10b981" font-size="12" font-weight="700" font-family="Barlow,sans-serif">Use RAG</text>
  <text x="630" y="234" text-anchor="middle" fill="#64748b" font-size="11" font-family="Barlow,sans-serif">index + retrieve ✓</text>

  <!-- Q2 NO → Fine-Tune (down) -->
  <line x1="350" y1="245" x2="350" y2="284" stroke="#ef4444" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="363" y="269" fill="#ef4444" font-size="11" font-weight="700" font-family="Barlow,sans-serif">NO</text>

  <!-- FINE-TUNE box -->
  <rect x="220" y="284" width="260" height="52" rx="10" fill="rgba(99,102,241,0.25)" stroke="#6366f1" stroke-width="2"/>
  <text x="350" y="306" text-anchor="middle" fill="#818cf8" font-size="15" font-weight="700" font-family="Barlow,sans-serif">Fine-Tune</text>
  <text x="350" y="324" text-anchor="middle" fill="#6366f1" font-size="11" font-family="Barlow,sans-serif">format · style · domain · reasoning</text>

  <!-- Fine-Tune → GPU Q (down) -->
  <line x1="350" y1="336" x2="350" y2="375" stroke="#6366f1" stroke-width="1.5" marker-end="url(#a0)"/>

  <!-- GPU Q -->
  <rect x="185" y="375" width="330" height="52" rx="9" fill="rgba(26,26,52,0.95)" stroke="#2a2a50" stroke-width="1.5"/>
  <text x="350" y="397" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="Barlow,sans-serif">What is your GPU budget?</text>
